name: 📱 Build Phone Assistant APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # Permet de lancer manuellement depuis GitHub

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Télécharger le code
        uses: actions/checkout@v4

      - name: ☕ Configurer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 Configurer Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🔑 Rendre gradlew exécutable
        run: chmod +x gradlew

      - name: 🏗️ Compiler l'APK (mode debug)
        run: ./gradlew assembleDebug --no-daemon

      - name: 📦 Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneAssistant-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: ✅ Résumé
        run: |
          echo "## 📱 APK compilé avec succès !" >> $GITHUB_STEP_SUMMARY
          echo "Téléchargez l'APK dans l'onglet **Artifacts** ci-dessous." >> $GITHUB_STEP_SUMMARY
          echo "Taille : $(du -sh app/build/outputs/apk/debug/app-debug.apk | cut -f1)" >> $GITHUB_STEP_SUMMARY
